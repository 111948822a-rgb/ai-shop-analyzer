# =============================================================================
# Render Blueprint —— AI Shop Analyzer
# 用法：Render 后台 -> Blueprints -> New Blueprint -> 连接本仓库，Render 会按此文件
#       自动创建 1 个 Postgres + 后端(Docker) + 前端(Node) 三个服务。
#
# 说明：
#  - 后端用 Docker 部署（dockerfilePath 指向 backend/Dockerfile，构建上下文 = backend/）。
#  - 前端用 Node 部署（Next.js，`next build` + `next start`）。
#  - Postgres 的 DATABASE_URL 通过 fromService 自动注入后端，无需手填。
#  - 前端通过 NEXT_PUBLIC_API_URL 访问后端（部署后请确认此处域名与实际后端一致）。
#  - Celery 异步（可选）：本项目分析默认用 FastAPI BackgroundTasks，无需 Redis；
#    若要启用 Celery（MIAODA_USE_CELERY=true），需额外建 Redis 服务并在 backend 注入
#    REDIS_URL，再起一个 worker 服务（见 DEPLOYMENT.md）。
# =============================================================================

services:
  # ---------------- 1) PostgreSQL 数据库 ----------------
  - type: postgres
    name: ai-shop-db
    databaseName: ai_shop
    user: ai_shop
    plan: free
    postgresMajorVersion: "16"
    # Render 会自动提供一个 DATABASE_URL（含 sslmode=require），通过下方 fromService 注入后端

  # ---------------- 2) 后端 (FastAPI, Docker) ----------------
  - type: web
    name: ai-shop-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    plan: free
    region: oregon            # 与数据库同区域，降低延迟
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromService:
          name: ai-shop-db
          type: postgres
          envVar: DATABASE_URL
      - key: DASHSCOPE_API_KEY
        sync: false           # 在 Render 后台手动填写（私密）
      - key: QWEN_MODEL
        value: qwen3.7-max
      - key: FEISHU_WEBHOOK_URL
        sync: false
      - key: FEISHU_WEBHOOK_SECRET
        sync: false
      - key: FEISHU_APP_ID
        sync: false
      - key: FEISHU_APP_SECRET
        sync: false
      - key: MIAODA_WEBHOOK_SECRET
        sync: false
      - key: MIAODA_BITABLE_APP_TOKEN
        sync: false
      - key: MIAODA_BITABLE_TABLE_ID
        sync: false
      - key: MIAODA_USE_CELERY
        value: "false"
      # 前端报告页基址：填前端服务在 Render 的真实域名
      - key: FRONTEND_BASE_URL
        value: https://ai-shop-frontend.onrender.com
      # 可选：启用 Celery 时才需要
      - key: REDIS_URL
        sync: false

  # ---------------- 3) 前端 (Next.js, Node) ----------------
  - type: web
    name: ai-shop-frontend
    runtime: node
    rootDir: frontend
    plan: free
    region: oregon
    healthCheckPath: /
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # 关键：前端调用后端的基址。用上面后端服务在 Render 的真实域名替换
      - key: NEXT_PUBLIC_API_URL
        value: https://ai-shop-backend.onrender.com
